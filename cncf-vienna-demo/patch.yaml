machine:
    install:
        disk: /dev/sda
        image: factory.talos.dev/metal-installer/376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba:v1.13.9
    network:
        interfaces:
            - interface: enp0s3
              dhcp: true
              vip:
                  ip: 172.20.10.100
    files:
        - path: /var/lib/kubelet/zot-config.json
          op: create
          permissions: 0o644
          content: |
              {
                "distSpecVersion": "1.1.0",
                "storage": {
                  "rootDirectory": "/var/lib/registry"
                },
                "http": {
                  "address": "0.0.0.0",
                  "port": "5000"
                },
                "log": {
                  "level": "info"
                },
                "extensions": {
                  "search": {
                    "enable": true
                  },
                  "ui": {
                    "enable": true
                  },
                  "sync": {
                    "enable": true,
                    "registries": [
                      {
                        "urls": ["https://registry-1.docker.io"],
                        "onDemand": true,
                        "tlsVerify": true,
                        "content": [{"prefix": "**"}]
                      },
                      {
                        "urls": ["https://ghcr.io"],
                        "onDemand": true,
                        "tlsVerify": true,
                        "content": [{"prefix": "**"}]
                      },
                      {
                        "urls": ["https://registry.k8s.io"],
                        "onDemand": true,
                        "tlsVerify": true,
                        "content": [{"prefix": "**"}]
                      },
                      {
                        "urls": ["https://quay.io"],
                        "onDemand": true,
                        "tlsVerify": true,
                        "content": [{"prefix": "**"}]
                      }
                    ]
                  }
                }
              }
    registries:
        mirrors:
            docker.io:
                endpoints:
                    - http://172.20.10.100:5000
            registry.k8s.io:
                endpoints:
                    - http://172.20.10.100:5000
            ghcr.io:
                endpoints:
                    - http://172.20.10.100:5000
            quay.io:
                endpoints:
                    - http://172.20.10.100:5000
    pods:
        - apiVersion: v1
          kind: Pod
          metadata:
              name: zot
              namespace: kube-system
              labels:
                  app: zot
          spec:
              hostNetwork: true
              containers:
                  - name: zot
                    image: ghcr.io/project-zot/zot:latest
                    ports:
                        - name: http
                          containerPort: 5000
                          hostPort: 5000
                    securityContext:
                        runAsUser: 0
                    volumeMounts:
                        - name: data
                          mountPath: /var/lib/registry
                        - name: config
                          mountPath: /etc/zot/config.json
                          readOnly: true
              volumes:
                  - name: data
                    hostPath:
                        path: /var/mnt/data
                        type: Directory
                  - name: config
                    hostPath:
                        path: /var/lib/kubelet/zot-config.json
                        type: File
cluster:
    allowSchedulingOnControlPlanes: true
    inlineManifests:
        - name: flux-installer-rbac
          contents: |
              apiVersion: v1
              kind: ServiceAccount
              metadata:
                name: flux-installer
                namespace: kube-system
              ---
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRoleBinding
              metadata:
                name: flux-installer
              roleRef:
                apiGroup: rbac.authorization.k8s.io
                kind: ClusterRole
                name: cluster-admin
              subjects:
                - kind: ServiceAccount
                  name: flux-installer
                  namespace: kube-system
        - name: flux-installer-job
          contents: |
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: flux-installer
                namespace: kube-system
              spec:
                backoffLimit: 2
                activeDeadlineSeconds: 600
                template:
                  spec:
                    serviceAccountName: flux-installer
                    restartPolicy: Never
                    containers:
                      - name: install
                        image: alpine/helm:3.16.2
                        command: ["/bin/sh", "-c"]
                        args:
                          - |
                            helm repo add fluxcd-community https://fluxcd-community.github.io/helm-charts
                            helm repo update
                            helm upgrade --install flux2 fluxcd-community/flux2 \
                              --namespace flux-system --create-namespace \
                              --wait --timeout 5m
        - name: flux-apps-source
          contents: |
              apiVersion: source.toolkit.fluxcd.io/v1
              kind: OCIRepository
              metadata:
                name: apps
                namespace: flux-system
              spec:
                interval: 1m
                url: oci://172.20.10.100:5000/apps
                ref:
                  tag: latest
                insecure: true
              ---
              apiVersion: kustomize.toolkit.fluxcd.io/v1
              kind: Kustomization
              metadata:
                name: apps
                namespace: flux-system
              spec:
                interval: 5m
                sourceRef:
                  kind: OCIRepository
                  name: apps
                path: "./"
                prune: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: data
provisioning:
  diskSelector:
    match: disk.dev_path == '/dev/sdb'
  minSize: 1GB
